[project]
name = "pdf-rag-application"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.164.0",
    "inngest>=0.5.20",
    "llama-index-core>=0.14.26",
    "llama-index-readers-file>=0.8.0",
    "openai>=3.55.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
pdf-rag-application = "pdf_rag_application:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
